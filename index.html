<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Mi Obra AR</title>
  
  <!-- Versiones actualizadas -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 1000;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <img id="fondo"           src="fondo.png">
      <img id="detalles_fondo"  src="detalles_fondo.png">
      <img id="capa3"           src="capa3.png">
      <img id="capa4"           src="capa4.png">
      <img id="capa5"           src="capa5.png">
      <img id="frente"          src="frente.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false"></a-camera>

    <!-- Target de la obra -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Fondo (más atrás) -->
      <a-image src="#fondo" 
               position="0 0 0" 
               width="1" height="1.4"
               material="transparent: true; alphaTest: 0.1"></a-image>

      <!-- Detalles de fondo -->
      <a-image src="#detalles_fondo" 
               position="0 0 0.04" 
               width="1" height="1.4"
               material="transparent: true; alphaTest: 0.1"></a-image>

      <!-- Capas intermedias -->
      <a-image src="#capa3" 
               position="0 0 0.08" 
               width="1" height="1.4"
               material="transparent: true; alphaTest: 0.1"></a-image>

      <a-image src="#capa4" 
               position="0 0 0.12" 
               width="1" height="1.4"
               material="transparent: true; alphaTest: 0.1"></a-image>

      <a-image src="#capa5" 
               position="0 0 0.16" 
               width="1" height="1.4"
               material="transparent: true; alphaTest: 0.1"></a-image>

      <!-- Frente (más cerca de la cámara) -->
      <a-image src="#frente" 
               position="0 0 0.22" 
               width="1" height="1.4"
               material="transparent: true; alphaTest: 0.1"></a-image>

    </a-entity>
  </a-scene>

</body>
</html>
