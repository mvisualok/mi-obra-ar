<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>M Visual - Realidad Aumentada</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #inicio {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    #boton {
      margin-top: 25px;
      padding: 16px 30px;
      border: none;
      border-radius: 30px;
      background: white;
      color: black;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="inicio">
    <h1>M Visual</h1>
    <p>Activá la cámara y apuntá a la obra</p>
    <button id="boton">ACTIVAR REALIDAD AUMENTADA</button>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
      filterMinCF: 0.05;
      filterBeta: 1;
    "
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets>
      <img id="fondo"          src="./fondo.png"          crossorigin="anonymous">
      <img id="detalles_fondo" src="./detalles_fondo.png" crossorigin="anonymous">
      <img id="capa3"          src="./capa3.png"          crossorigin="anonymous">
      <img id="capa4"          src="./capa4.png"          crossorigin="anonymous">
      <img id="capa5"          src="./capa5.png"          crossorigin="anonymous">
      <img id="frente"         src="./frente.png"         crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Mucha más separación -->
      <a-image src="#fondo" position="0 0 0" width="1.4" height="1.95"
               material="transparent: true; alphaTest: 0.1"></a-image>

      <a-image src="#detalles_fondo" position="0 0 0.20" width="1.4" height="1.95"
               material="transparent: true; alphaTest: 0.1"></a-image>

      <a-image src="#capa3" position="0 0 0.40" width="1.4" height="1.95"
               material="transparent: true; alphaTest: 0.1"></a-image>

      <a-image src="#capa4" position="0 0 0.60" width="1.4" height="1.95"
               material="transparent: true; alphaTest: 0.1"></a-image>

      <a-image src="#capa5" position="0 0 0.80" width="1.4" height="1.95"
               material="transparent: true; alphaTest: 0.1"></a-image>

      <a-image src="#frente" position="0 0 1.05" width="1.4" height="1.95"
               material="transparent: true; alphaTest: 0.1"></a-image>

    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const scene = document.querySelector("a-scene");
      const boton = document.querySelector("#boton");
      let arSystem;

      scene.addEventListener("loaded", function () {
        arSystem = scene.systems["mindar-image-system"];
      });

      boton.addEventListener("click", function () {
        if (!arSystem) {
          alert("Esperá unos segundos e intentá de nuevo");
          return;
        }
        document.querySelector("#inicio").style.display = "none";
        arSystem.start();
      });
    });
  </script>

</body>
</html>
