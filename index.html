<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>M Visual - Realidad Aumentada</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #inicio {

      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      background: #000;

      color: white;

      font-family: Arial, sans-serif;

      padding: 30px;

      box-sizing: border-box;
    }

    #inicio h1 {

      font-size: 28px;

      margin: 0 0 15px 0;
    }

    #inicio p {

      font-size: 16px;

      line-height: 1.5;

      max-width: 300px;

      opacity: 0.8;
    }

    #boton {

      margin-top: 25px;

      padding: 16px 30px;

      border: none;

      border-radius: 30px;

      background: white;

      color: black;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;
    }

  </style>

</head>


<body>


  <!-- PANTALLA DE INICIO -->

  <div id="inicio">

    <h1>M Visual</h1>

    <p>
      Activá la cámara y apuntá al marcador de la obra
      para descubrir la realidad aumentada.
    </p>

    <button id="boton">
      ACTIVAR REALIDAD AUMENTADA
    </button>

  </div>


  <!-- ESCENA AR -->

  <a-scene

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
    "

    color-space="sRGB"

    renderer="colorManagement: true, physicallyCorrectLights"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
  >


    <!-- IMÁGENES -->

    <a-assets>

      <img
        id="fondo"
        src="./fondo.png"
        crossorigin="anonymous"
      >

    </a-assets>


    <!-- CÁMARA -->

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>


    <!-- MARCADOR -->

    <a-entity
      id="marcador"
      mindar-image-target="targetIndex: 0"
    >


      <!-- PRIMERA CAPA DE PRUEBA -->

      <a-image

        src="#fondo"

        position="0 0 0"

        width="1"

        height="1.4"

        material="
          transparent: true;
          alphaTest: 0.1;
        "

      ></a-image>


    </a-entity>


  </a-scene>


  <!-- CONTROL DE INICIO -->

  <script>

    document.addEventListener("DOMContentLoaded", function () {

      const scene = document.querySelector("a-scene");

      const boton = document.querySelector("#boton");

      let arSystem;


      scene.addEventListener("loaded", function () {

        arSystem = scene.systems["mindar-image-system"];

      });


      boton.addEventListener("click", function () {

        if (!arSystem) {

          alert("La realidad aumentada todavía está cargando. Esperá unos segundos y probá nuevamente.");

          return;

        }


        document.querySelector("#inicio").style.display = "none";


        arSystem.start();

      });


    });


  </script>


</body>

</html>
